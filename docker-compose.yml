services:
  app:
    build: .
    container_name: appointment-service
    env_file:
      - .env
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-not-secret-change-me}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - DJANGO_DB_HOST=db
      - DJANGO_DB_PORT=5432
      - DJANGO_DB_NAME=appointment_db
      - DJANGO_DB_USER=appointment_user
      - DJANGO_DB_PASSWORD=othersecretpassword
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-}
      - APPOINTMENT_SNS_TOPIC_ARN=${APPOINTMENT_SNS_TOPIC_ARN:-}
      - EVENTS_SQS_QUEUE_URL=${EVENTS_SQS_QUEUE_URL:-}
      - SCHEDULE_SERVICE_URL=${SCHEDULE_SERVICE_URL:-http://host.docker.internal:8008}
      - INTERNAL_SHARED_TOKEN=${INTERNAL_SHARED_TOKEN:-dev-internal-token}
      - SLOT_RESERVATION_TTL_MINUTES=${SLOT_RESERVATION_TTL_MINUTES:-10}
    ports:
      - "8001:8000"
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: postgres-appointment-service
    restart: always
    environment:
      POSTGRES_DB: appointment_db
      POSTGRES_USER: appointment_user
      POSTGRES_PASSWORD: othersecretpassword
    volumes:
      - postgres-appointment-data:/var/lib/postgresql/data

volumes:
  postgres-appointment-data:
